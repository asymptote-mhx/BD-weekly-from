<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>合作伙伴 · 市场工作台</title><link rel="stylesheet" href="styles.css?v=20260927-partners-1"><link rel="stylesheet" href="partners.css?v=20260927-partners-1"></head>
<body class="partners-page">
<header class="app-topbar"><div><p>Market Workspace</p><strong>合作伙伴</strong></div><nav><a href="ledger.html">项目台账</a><a href="resources.html">平台资源库</a><a href="index.html">填写周报</a></nav></header>
<main class="partners-shell">
  <section class="partners-heading"><div><p class="eyebrow">PARTNER NETWORK</p><h1>看清关系，也看清兑现。</h1><p>独立伙伴档案 · 七个评价维度 · 项目双向关联</p></div><button id="refreshPartners" type="button">读取 / 刷新</button></section>
  <details class="partner-settings" id="partnerSettings"><summary>资料连接设置</summary><div class="partner-settings-grid"><label>GitHub 用户名<input id="partnerOwner" autocomplete="username"></label><label>伙伴仓库<input id="partnerRepo" value="BD-Partner"></label><label>分支<input id="partnerBranch" value="main"></label><label>Token<input id="partnerToken" type="password" autocomplete="off" placeholder="沿用当前浏览器的台账连接"></label></div><p>资料从私有仓库读取。关联保存需要伙伴仓库写入权限；项目列表沿用台账连接。</p></details>
  <p id="partnerStatus" role="status" aria-live="polite">请读取伙伴资料。</p>
  <nav class="partner-tabs" aria-label="展示方式"><button type="button" id="showPeople" aria-pressed="true">伙伴档案</button><button type="button" id="showProjects" aria-pressed="false">项目关系 / 对比</button></nav>
  <section id="peopleView" class="partner-workspace"><aside><label class="partner-search">查找伙伴<input id="partnerSearch" type="search" placeholder="代号、角色、评价"></label><div id="partnerList"></div></aside><article id="partnerDetail"><p class="partner-empty">读取后选择一个伙伴。</p></article></section>
  <section id="projectsView" hidden><div class="project-picker"><label>选择台账项目<select id="relationProject"><option value="">请先读取台账</option></select></label><a id="backToLedger" href="ledger.html">打开项目台账 ↗</a><button type="button" id="addProjectPartner">关联伙伴</button></div><div id="projectRelations"></div></section>
</main>
<dialog id="linkDialog" class="partner-dialog"><form id="linkForm"><header><h2>关联伙伴与项目</h2><button type="button" id="closeLink">关闭</button></header><label>伙伴<select id="linkPartner" required></select></label><label>台账项目<select id="linkProject" required></select></label><label>已达到的合作阶段<select id="linkStage"><option value="0">接触项目</option><option value="1">合作意向</option><option value="2">已落实合作（明确分工或实际启动）</option><option value="3">完成履约</option></select></label><label>当前合作状态<input id="linkStatus" required placeholder="如：洽谈中、合作中、本项目不合作"></label><label>项目角色<input id="linkRole" required placeholder="如：引荐、机构协调、设计合作"></label><label>依据 / 新增事实<textarea id="linkEvidence" rows="3" required></textarea></label><label>下一步验证<textarea id="linkNext" rows="2"></textarea></label><p>阶段记录已发生的经历；停止合作不抹除历史接触。关联会直接保存到伙伴仓库。</p><p id="linkResult" role="status"></p><footer><button type="submit" id="saveLink">保存关联</button></footer></form></dialog>
<script src="partner_core.js?v=20260927-partners-1"></script><script src="partner_api.js?v=20260927-partners-1"></script><script src="partners.js?v=20260927-partners-1"></script>
</body></html>
